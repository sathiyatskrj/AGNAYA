<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" style="border-radius: 12px; background: linear-gradient(135deg, #090c15 0%, #161226 50%, #0a0d18 100%);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="m4SolarDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m4GridCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="m4ArcFlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
    <linearGradient id="m4CardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="m4WaterFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="m4SparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#FF3366" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="m4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Perspective Grid Plane -->
  <g opacity="0.2" stroke="#6366F1" stroke-width="0.8">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="175" x2="800" y2="175"/>
    <line x1="0" y1="188" x2="800" y2="188"/>
    <line x1="0" y1="198" x2="800" y2="198"/>
    <!-- Perspective convergence lines -->
    <line x1="380" y1="90" x2="0" y2="200"/>
    <line x1="380" y1="90" x2="120" y2="200"/>
    <line x1="380" y1="90" x2="240" y2="200"/>
    <line x1="380" y1="90" x2="360" y2="200"/>
    <line x1="380" y1="90" x2="480" y2="200"/>
    <line x1="380" y1="90" x2="600" y2="200"/>
    <line x1="380" y1="90" x2="720" y2="200"/>
    <line x1="380" y1="90" x2="800" y2="200"/>
  </g>

  <!-- Left: Scorching Solar Corona Dome -->
  <g transform="translate(80, 85)">
    <circle cx="0" cy="0" r="70" fill="url(#m4SolarDome)" opacity="0.25" filter="url(#m4Glow)"/>
    <circle cx="0" cy="0" r="46" fill="url(#m4SolarDome)" opacity="0.5"/>
    <circle cx="0" cy="0" r="26" fill="#FEF08A" opacity="0.95" filter="url(#m4Glow)"/>
    <!-- Solar Flare Rays -->
    <path d="M0 -34 L0 -48 M24 -24 L34 -34 M34 0 L48 0 M24 24 L34 34 M0 34 L0 48 M-24 24 L-34 34 M-34 0 L-48 0 M-24 -24 L-34 -34" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- 47.9C Extreme Marker -->
    <rect x="-35" y="46" width="70" height="18" rx="4" fill="#18181B" stroke="#EF4444" stroke-width="1"/>
    <text x="0" y="59" fill="#F87171" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">47.9°C HEAT</text>
  </g>

  <!-- Center Left: 3D City Silhouette & Kharun River Ribbon -->
  <g transform="translate(190, 60)">
    <!-- Kharun River Curve -->
    <path d="M-20 110 Q40 85 100 100 T220 80" fill="none" stroke="url(#m4WaterFlow)" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    <!-- Water Tanker Route -->
    <path d="M20 118 Q80 105 140 115 T240 100" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.85"/>
    
    <!-- 3D Isometric Buildings (City Skyline) -->
    <!-- Commercial Center (Pucca) -->
    <polygon points="50,100 70,88 90,100 70,112" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <polygon points="50,100 70,112 70,50 50,38" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <polygon points="70,112 90,100 90,38 70,50" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <polygon points="50,38 70,26 90,38 70,50" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <!-- Lit Windows -->
    <circle cx="60" cy="65" r="1.5" fill="#38BDF8"/>
    <circle cx="60" cy="78" r="1.5" fill="#38BDF8"/>
    <circle cx="80" cy="65" r="1.5" fill="#38BDF8"/>

    <!-- Slum Cluster (Tin Roofs Heat Trap) -->
    <polygon points="105,105 120,95 135,105 120,115" fill="#DC2626" opacity="0.85" stroke="#EF4444" stroke-width="1"/>
    <polygon points="105,105 120,115 120,95 105,85" fill="#7F1D1D" stroke="#991B1B" stroke-width="1"/>
    <polygon points="120,115 135,105 135,85 120,95" fill="#991B1B" stroke="#B91C1C" stroke-width="1"/>
    <text x="120" y="80" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">+4.5°C TIN</text>

    <!-- Hospital AIIMS / Ambedkar (Glowing Cross) -->
    <polygon points="150,90 175,75 200,90 175,105" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
    <polygon points="150,90 175,105 175,55 150,40" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <polygon points="175,105 200,90 200,40 175,55" fill="#047857" stroke="#059669" stroke-width="1"/>
    <polygon points="150,40 175,25 200,40 175,55" fill="#059669" stroke="#34D399" stroke-width="1"/>
    <!-- Hospital Red/Green Cross -->
    <path d="M172 38 h6 v-4 h-6 v-4 h-4 v4 h-6 v4 h6 v6 h4 z" fill="#34D399" filter="url(#m4Glow)"/>

    <!-- Municipal Water Tanker Vehicle -->
    <g transform="translate(140, 110)">
      <rect x="0" y="0" width="18" height="8" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8"/>
      <circle cx="4" cy="9" r="2" fill="#0F172A"/>
      <circle cx="14" cy="9" r="2" fill="#0F172A"/>
      <circle cx="9" cy="0" r="1.5" fill="#F59E0B" filter="url(#m4Glow)"/>
    </g>
  </g>

  <!-- Center Right: Transmission Grid & Substation Arc Short-Circuit -->
  <g transform="translate(450, 45)">
    <!-- Steel Lattice Transmission Tower 1 (220 kV) -->
    <path d="M20 135 L40 30 L60 135 M28 105 L52 105 M33 75 L47 75 M40 30 L40 15 M20 45 L60 45 M15 70 L65 70" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="15" r="2" fill="#38BDF8"/>

    <!-- Catenary Power Lines with Sag -->
    <path d="M60 45 Q120 78 180 50" fill="none" stroke="url(#m4GridCyan)" stroke-width="2.5" stroke-dasharray="8,3"/>
    <path d="M65 70 Q125 98 185 75" fill="none" stroke="url(#m4GridCyan)" stroke-width="2.5" stroke-dasharray="8,3"/>

    <!-- Substation S03 Amanaka (Fault Location) -->
    <g transform="translate(170, 45)">
      <!-- Substation Base -->
      <rect x="0" y="40" width="55" height="40" rx="3" fill="#18181B" stroke="#475569" stroke-width="1"/>
      <rect x="6" y="46" width="20" height="28" rx="2" fill="#27272A" stroke="#71717A" stroke-width="1"/>
      <rect x="30" y="46" width="18" height="28" rx="2" fill="#27272A" stroke="#71717A" stroke-width="1"/>
      <!-- Radiator fins -->
      <line x1="8" y1="50" x2="8" y2="70" stroke="#52525B" stroke-width="1"/>
      <line x1="12" y1="50" x2="12" y2="70" stroke="#52525B" stroke-width="1"/>
      <line x1="16" y1="50" x2="16" y2="70" stroke="#52525B" stroke-width="1"/>
      
      <!-- SPECTACULAR ARC FLASH SHORT-CIRCUIT -->
      <circle cx="16" cy="40" r="24" fill="url(#m4SparkGlow)" filter="url(#m4Glow)"/>
      <path d="M16 20 L20 32 L30 26 L22 38 L32 44 L18 42 L16 55 L12 42 L2 44 L10 36 L4 28 L14 32 Z" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.2" filter="url(#m4Glow)"/>
      <path d="M16 30 L25 15 M16 35 L-5 25 M20 40 L35 50 M10 40 L-2 48" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round"/>
      
      <!-- Fault Trip Badge -->
      <rect x="-8" y="86" width="70" height="18" rx="4" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
      <text x="27" y="99" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">S03 ARC TRIP</text>
    </g>
  </g>

  <!-- Right: Glassmorphic Telemetry HUD Card -->
  <g transform="translate(620, 20)">
    <rect x="0" y="0" width="165" height="160" rx="8" fill="url(#m4CardBg)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.3" filter="url(#m4Glow)"/>
    <text x="12" y="24" fill="#A5B4FC" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MODE 4 THEATRE</text>
    <line x1="12" y1="32" x2="153" y2="32" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Telemetry Row 1: Engine -->
    <text x="12" y="50" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9">3D Graphic Engine</text>
    <text x="153" y="50" fill="#38BDF8" font-family="Inter, monospace" font-size="10" font-weight="600" text-anchor="end">WebGL / Three.js</text>
    
    <!-- Telemetry Row 2: Scenario Stage -->
    <text x="12" y="74" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9">Causal Timeline</text>
    <text x="153" y="74" fill="#F59E0B" font-family="Inter, monospace" font-size="10" font-weight="600" text-anchor="end">6-Stage Cascade</text>
    
    <!-- Telemetry Row 3: Grid Load -->
    <text x="12" y="98" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9">Grid Surge Peak</text>
    <text x="153" y="98" fill="#EF4444" font-family="Inter, monospace" font-size="10" font-weight="600" text-anchor="end">475.9 MW</text>
    
    <!-- Telemetry Row 4: Water Deficit -->
    <text x="12" y="122" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9">Kharun Pumping</text>
    <text x="153" y="122" fill="#38BDF8" font-family="Inter, monospace" font-size="10" font-weight="600" text-anchor="end">180 MLD (WP01)</text>

    <!-- Bottom Status Pill -->
    <rect x="12" y="134" width="141" height="18" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.8"/>
    <circle cx="22" cy="143" r="3" fill="#22C55E"/>
    <text x="30" y="146" fill="#E0E7FF" font-family="Inter, sans-serif" font-size="8.5" font-weight="600">INTERACTIVE CINEMATIC</text>
  </g>
</svg>
