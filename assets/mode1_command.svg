<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" style="border-radius: 12px; background: linear-gradient(135deg, #0b0f19 0%, #151a28 50%, #0d121f 100%);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="nodePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Background Grids (Perspective Plane) -->
  <g opacity="0.18" stroke="#3B82F6" stroke-width="0.75">
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="185" x2="800" y2="185"/>
    <line x1="0" y1="195" x2="800" y2="195"/>
    <!-- Perspective radial lines -->
    <line x1="400" y1="100" x2="0" y2="200"/>
    <line x1="400" y1="100" x2="160" y2="200"/>
    <line x1="400" y1="100" x2="320" y2="200"/>
    <line x1="400" y1="100" x2="480" y2="200"/>
    <line x1="400" y1="100" x2="640" y2="200"/>
    <line x1="400" y1="100" x2="800" y2="200"/>
  </g>

  <!-- Left: Solar Thermal Heat Radiation Art -->
  <g transform="translate(70, 95)">
    <!-- Thermal corona rings -->
    <circle cx="0" cy="0" r="65" fill="url(#sunGlow)" opacity="0.15" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="22" fill="#F59E0B" opacity="0.85" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="14" fill="#FEF08A"/>
    <!-- Solar Flare Rays -->
    <path d="M0 -30 L0 -42 M21 -21 L30 -30 M30 0 L42 0 M21 21 L30 30 M0 30 L0 42 M-21 21 L-30 30 M-30 0 L-42 0 M-21 -21 L-30 -30" 
          stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Heat plume wave -->
    <path d="M35 -15 Q55 -30 85 -10 T145 -15" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.6" stroke-dasharray="3 3"/>
    <path d="M35 10 Q65 0 95 20 T155 10" fill="none" stroke="#F97316" stroke-width="2" opacity="0.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Center-Left: Transmission Line Catenary Sag -->
  <g stroke="#60A5FA" fill="none" opacity="0.75">
    <!-- Transmission lines swinging across -->
    <path d="M150 75 Q 260 120, 370 70" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M150 85 Q 260 130, 370 80" stroke-width="1.5"/>
    <path d="M370 70 Q 480 115, 590 65" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M370 80 Q 480 125, 590 75" stroke-width="1.5"/>
  </g>

  <!-- Pylon / Tower 1 at x=150 -->
  <g transform="translate(150, 45)" stroke="#94A3B8" stroke-width="1.5" fill="none">
    <path d="M-15 125 L0 25 L15 125"/>
    <path d="M-22 50 L22 50 M-28 75 L28 75 M-18 100 L18 100"/>
    <path d="M-15 50 L15 75 M15 50 L-15 75 M-18 75 L18 100 M18 75 L-18 100"/>
    <!-- Insulator strings -->
    <line x1="-22" y1="50" x2="-22" y2="60" stroke="#38BDF8" stroke-width="2"/>
    <line x1="22" y1="50" x2="22" y2="60" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="25" r="3" fill="#EF4444"/>
  </g>

  <!-- Pylon / Tower 2 (Center) at x=370 -->
  <g transform="translate(370, 40)" stroke="#CBD5E1" stroke-width="1.75" fill="none">
    <path d="M-18 130 L0 20 L18 130"/>
    <path d="M-26 48 L26 48 M-32 75 L32 75 M-22 102 L22 102"/>
    <path d="M-18 48 L18 75 M18 48 L-18 75 M-22 75 L22 102 M22 75 L-22 102"/>
    <!-- Insulators with energy glow -->
    <circle cx="-26" cy="50" r="4" fill="url(#nodePulse)"/>
    <circle cx="26" cy="50" r="4" fill="url(#nodePulse)"/>
    <circle cx="0" cy="20" r="3.5" fill="#EF4444" filter="url(#glow)"/>
  </g>

  <!-- Pylon / Tower 3 at x=590 -->
  <g transform="translate(590, 35)" stroke="#94A3B8" stroke-width="1.5" fill="none">
    <path d="M-15 135 L0 25 L15 135"/>
    <path d="M-22 50 L22 50 M-28 75 L28 75 M-18 100 L18 100"/>
    <path d="M-15 50 L15 75 M15 50 L-15 75"/>
    <circle cx="0" cy="25" r="3" fill="#EF4444"/>
  </g>

  <!-- City Skyline Silhouette (Raipur Municipal Ward Nodes) -->
  <g fill="#1E293B" opacity="0.85">
    <rect x="620" y="110" width="22" height="60" rx="2"/>
    <rect x="646" y="90" width="28" height="80" rx="2"/>
    <rect x="678" y="120" width="18" height="50" rx="2"/>
    <rect x="700" y="80" width="32" height="90" rx="2"/>
    <rect x="736" y="105" width="24" height="65" rx="2"/>
    <rect x="764" y="125" width="26" height="45" rx="2"/>
    <!-- Building Windows (lit during heat emergency) -->
    <g fill="#F59E0B" opacity="0.75">
      <circle cx="654" cy="100" r="1.5"/><circle cx="664" cy="100" r="1.5"/>
      <circle cx="654" cy="115" r="1.5"/><circle cx="664" cy="115" r="1.5"/>
      <circle cx="708" cy="95" r="1.5"/><circle cx="720" cy="95" r="1.5"/>
      <circle cx="708" cy="110" r="1.5"/><circle cx="720" cy="110" r="1.5"/>
      <circle cx="708" cy="125" r="1.5"/><circle cx="720" cy="125" r="1.5"/>
    </g>
  </g>

  <!-- Telemetry Badge (Floating HUD) -->
  <g transform="translate(620, 20)">
    <rect x="0" y="0" width="165" height="52" rx="8" fill="url(#cardBg)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <circle cx="16" cy="18" r="4" fill="#EF4444" filter="url(#glow)"/>
    <text x="26" y="22" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LIVE HEAT CASCADE</text>
    <text x="14" y="40" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Coupled Grid &amp; Health Twin</text>
  </g>

  <!-- Dynamic Energy Particles along Transmission line -->
  <circle cx="210" cy="98" r="3.5" fill="#60A5FA" filter="url(#glow)"/>
  <circle cx="310" cy="104" r="3" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="430" cy="95" r="3.5" fill="#60A5FA" filter="url(#glow)"/>
  <circle cx="530" cy="92" r="3" fill="#38BDF8" filter="url(#glow)"/>
</svg>
