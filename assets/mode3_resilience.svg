<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" style="border-radius: 12px; background: linear-gradient(135deg, #0d0e1a 0%, #17182e 50%, #101121 100%);">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="qLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Curve Background (Resilience Q(t) Concept) -->
  <g opacity="0.25">
    <path d="M 0 160 Q 250 80, 500 130 T 800 90" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M 0 175 Q 250 140, 500 170 T 800 150" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>

  <!-- Left: The Municipal Resilience Shield -->
  <g transform="translate(100, 100)">
    <!-- Outer Shield Frame -->
    <path d="M 0 -60 Q 45 -55, 55 -25 Q 55 35, 0 65 Q -55 35, -55 -25 Q -45 -55, 0 -60 Z" 
          fill="#1E1B4B" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#shieldGlow)"/>
    <!-- Inner Emblem -->
    <path d="M 0 -45 Q 32 -42, 40 -20 Q 40 25, 0 48 Q -40 25, -40 -20 Q -32 -42, 0 -45 Z" 
          fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
    <!-- Golden Wheat / Energy Spire -->
    <line x1="0" y1="-30" x2="0" y2="28" stroke="#FEF08A" stroke-width="2.5"/>
    <circle cx="0" cy="-30" r="4" fill="#FEF08A" filter="url(#shieldGlow)"/>
    <!-- Lifeline Cross symbol -->
    <path d="M -12 2 L 12 2 M 0 -10 L 0 14" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Center-Left: Potable Water Tanker (Municipal Fleet Intervention) -->
  <g transform="translate(260, 115)">
    <!-- Tanker Chassis -->
    <rect x="-45" y="0" width="75" height="15" rx="3" fill="#334155" stroke="#475569" stroke-width="1.2"/>
    <!-- Water Tank (Cylinder) -->
    <rect x="-42" y="-22" width="48" height="22" rx="10" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Cab -->
    <path d="M 6 -22 L 20 -22 L 26 -8 L 26 0 L 6 0 Z" fill="#D97706" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Windshield -->
    <polygon points="9,-20 18,-20 22,-10 9,-10" fill="#E2E8F0" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="-30" cy="15" r="9" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
    <circle cx="-30" cy="15" r="3" fill="#94A3B8"/>
    <circle cx="-10" cy="15" r="9" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
    <circle cx="-10" cy="15" r="3" fill="#94A3B8"/>
    <circle cx="18" cy="15" r="9" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
    <circle cx="18" cy="15" r="3" fill="#94A3B8"/>
    <text x="-35" y="-8" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">RMC WATER</text>
  </g>

  <!-- Center-Right: Shaded Cooling Centre (Shelter Iconography) -->
  <g transform="translate(435, 105)">
    <!-- Canopy Roof -->
    <polygon points="-40,-15 0,-40 40,-15" fill="#8B5CF6" stroke="#A78BFA" stroke-width="1.5"/>
    <!-- Overhang shade fringe -->
    <path d="M -40 -15 Q -30 -10, -20 -15 Q -10 -10, 0 -15 Q 10 -10, 20 -15 Q 30 -10, 40 -15" 
          fill="none" stroke="#C4B5FD" stroke-width="1.5"/>
    <!-- Support Columns -->
    <line x1="-32" y1="-15" x2="-32" y2="25" stroke="#94A3B8" stroke-width="2"/>
    <line x1="32" y1="-15" x2="32" y2="25" stroke="#94A3B8" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="25" stroke="#64748B" stroke-width="1.5"/>
    <!-- Floor Plinth -->
    <rect x="-42" y="25" width="84" height="6" rx="2" fill="#334155"/>
    <!-- Misting Fan / Cool Air Flow -->
    <circle cx="0" cy="0" r="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M -5 -3 L 5 3 M -3 5 L 3 -5" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M -18 10 Q 0 16, 18 10" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>

  <!-- Right: Continuous Q(t) Resilience Wave Graphic -->
  <g transform="translate(600, 110)">
    <!-- Axis lines -->
    <line x1="-40" y1="25" x2="70" y2="25" stroke="#64748B" stroke-width="1.5"/>
    <line x1="-40" y1="25" x2="-40" y2="-45" stroke="#64748B" stroke-width="1.5"/>
    <!-- Baseline Drop curve (Red) -->
    <path d="M -40 -35 L -10 -35 Q 10 20, 30 15 L 70 20" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Shielded Resilience Curve (Green) -->
    <path d="M -40 -35 L -10 -35 Q 10 -15, 30 -25 L 70 -30" fill="none" stroke="#10B981" stroke-width="2.5" filter="url(#shieldGlow)"/>
    <!-- Shaded AUC Deficit Area -->
    <polygon points="-10,-35 10,-15 30,-25 70,-30 70,20 30,15 10,20 -10,-35" fill="#10B981" opacity="0.18"/>
    <!-- Label -->
    <text x="-5" y="-40" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">+38% DIVIDEND</text>
  </g>

  <!-- Top Right HUD Badge -->
  <g transform="translate(615, 18)">
    <rect x="0" y="0" width="170" height="52" rx="8" fill="#1B1736" stroke="rgba(217,119,6,0.4)" stroke-width="1"/>
    <circle cx="16" cy="18" r="4" fill="#F59E0B" filter="url(#shieldGlow)"/>
    <text x="26" y="22" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INTERVENTIONS</text>
    <text x="14" y="40" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">HiGHS MILP &amp; Q(t) Resilience</text>
  </g>
</svg>
