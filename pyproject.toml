[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agnaya"
version = "3.1.0"
description = "Heatwave-to-Infrastructure Cascading Failure Simulator & Decision Support Engine for Raipur, Chhattisgarh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AGNAYA Research Team" }
]
keywords = [
    "heatwave", "power-grid", "infrastructure-resilience", "digital-twin",
    "ieee-738", "ieee-c57-91", "raipur", "chhattisgarh", "cspdcl"
]
dependencies = [
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "networkx>=3.2",
    "plotly>=5.18.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.15.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "linerate>=5.0.0",
    "pythermalcomfort>=4.8.0",
    "httpx>=0.27.0",
    "SALib>=1.4.7",
    "reportlab>=4.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
agnaya-scenario = "agnaya.services.scenario_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agnaya*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
