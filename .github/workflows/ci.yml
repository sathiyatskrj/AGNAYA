name: AGNAYA CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    name: Secret Scanning & Credential Exposure Detection
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks Secret Scanner
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-typecheck:
    name: Lint (Ruff) & Typecheck (Mypy)
    runs-on: ubuntu-latest
    needs: [security]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Linting & Typecheck Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pydantic pydantic-settings

    - name: Run Ruff Linter
      run: |
        ruff check agnaya/ tests/

    - name: Run Mypy Typechecker
      run: |
        mypy agnaya/core/

  test:
    name: Multi-Model Scientific Verification & Pytest Suite
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install AGNAYA Package & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Pytest Suite with Coverage
      run: |
        pytest tests/ -v --cov=agnaya --cov-report=term --cov-report=xml

    - name: Run 15-Engine Invariant Verification Suite
      run: |
        python test_system.py

    - name: Verify Headless Scenario Execution
      run: |
        python -m agnaya.services.scenario_runner scenarios/may_2024_all_time_peak.yaml --json

    - name: Verify Application Syntax & Compilation
      run: |
        python -m py_compile config.py api.py app.py agnaya_launcher.py
