name: AGNAYA CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Verify 12-Stage Multi-Model Digital Twin Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Scientific & Modeling Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automated 12-Stage Verification Suite
      run: |
        python test_system.py

    - name: Verify FastAPI Microservice Compilation
      run: |
        python -m py_compile api.py app.py agnaya_launcher.py
